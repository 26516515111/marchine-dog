# ============================================================
# RT-DETR-R18 火焰检测训练配置
# 使用方式：复制到 PaddleDetection/configs/custom/ 后运行训练
# ============================================================

_BASE_: [
  '../datasets/coco_detection.yml',
  '../runtime.yml',
  '../rtdetr/_base_/optimizer_6x.yml',
  '../rtdetr/_base_/rtdetr_r50vd.yml',
  '../rtdetr/_base_/rtdetr_reader.yml',
]

# ==================== 训练配置 ====================
weights: output/rtdetr_r18_fire/model_final
find_unused_parameters: True
log_iter: 20

# 预训练权重：ResNet18 ImageNet 预训练（非 COCO 检测权重）
# RT-DETR 的预训练是 backbone-only，detection head 从头训练
pretrain_weights: https://paddledet.bj.bcebos.com/models/pretrained/ResNet18_vd_pretrained.pdparams

# 类别数量：检测 3 个类别（battery=1, board=2, fire=3）
num_classes: 3

# ==================== ResNet18 Backbone ====================
ResNet:
  depth: 18
  variant: d
  return_idx: [1, 2, 3]
  freeze_at: -1
  freeze_norm: false
  norm_decay: 0.

# ==================== HybridEncoder（轻量配置） ====================
HybridEncoder:
  hidden_dim: 256
  use_encoder_idx: [2]
  num_encoder_layers: 1
  encoder_layer:
    name: TransformerLayer
    d_model: 256
    nhead: 8
    dim_feedforward: 1024
    dropout: 0.
    activation: 'gelu'
  expansion: 0.5
  depth_mult: 1.0

# ==================== Transformer Decoder ====================
RTDETRTransformer:
  eval_idx: -1
  num_decoder_layers: 3

# ==================== 数据集配置 ====================
TrainDataset:
  !COCODataSet
  image_dir: train
  anno_path: annotations/instance_train.json
  dataset_dir: ../A_train/coco
  data_fields: ['image', 'gt_bbox', 'gt_class', 'is_crowd']
  allow_empty: true

EvalDataset:
  !COCODataSet
  image_dir: val
  anno_path: annotations/instance_val.json
  dataset_dir: ../A_train/coco

TestDataset:
  !ImageFolder
  anno_path: ../A_train/coco/annotations/instance_val.json

metric: COCO

# ==================== 数据读取器（DETR 风格） ====================
worker_num: 4

TrainReader:
  sample_transforms:
    - Decode: {}
    - RandomDistort: {prob: 0.8}
    - RandomExpand: {fill_value: [123.675, 116.28, 103.53]}
    - RandomCrop: {prob: 0.8}
    - RandomFlip: {}
  batch_transforms:
    - BatchRandomResize: {target_size: [480, 512, 544, 576, 608, 640, 640, 640, 672, 704, 736, 768, 800], random_size: True, random_interp: True, keep_ratio: False}
    - NormalizeImage: {mean: [0., 0., 0.], std: [1., 1., 1.], norm_type: none}
    - NormalizeBox: {}
    - BboxXYXY2XYWH: {}
    - Permute: {}
  batch_size: 4
  shuffle: true
  drop_last: true
  collate_batch: false
  use_shared_memory: true

EvalReader:
  sample_transforms:
    - Decode: {}
    - Resize: {target_size: [640, 640], keep_ratio: False, interp: 2}
    - NormalizeImage: {mean: [0., 0., 0.], std: [1., 1., 1.], norm_type: none}
    - Permute: {}
  batch_size: 4
  shuffle: false
  drop_last: false

TestReader:
  inputs_def:
    image_shape: [3, 640, 640]
  sample_transforms:
    - Decode: {}
    - Resize: {target_size: [640, 640], keep_ratio: False, interp: 2}
    - NormalizeImage: {mean: [0., 0., 0.], std: [1., 1., 1.], norm_type: none}
    - Permute: {}
  batch_size: 1
  shuffle: false
  drop_last: false

# ==================== 优化器（DETR 风格 AdamW） ====================
OptimizerBuilder:
  clip_grad_by_norm: 0.1
  regularizer: false
  optimizer:
    type: AdamW
    weight_decay: 0.0001

# ==================== 学习率配置 ====================
# 小数据集 (324 张) 增加训练轮数到 300
epoch: 300

LearningRate:
  base_lr: 0.0001
  schedulers:
    - !PiecewiseDecay
      gamma: 1.0
      milestones: [200]
      use_warmup: true
    - !LinearWarmup
      start_factor: 0.001
      steps: 2000
