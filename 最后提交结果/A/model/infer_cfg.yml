mode: paddle
draw_threshold: 0.5
metric: COCO
use_dynamic_shape: true
arch: YOLO
min_subgraph_size: 3
Preprocess:
- interp: 2
  keep_ratio: true
  target_size:
  - 832
  - 832
  type: Resize
- mean:
  - 0.0
  - 0.0
  - 0.0
  norm_type: none
  std:
  - 1.0
  - 1.0
  - 1.0
  type: NormalizeImage
- type: Permute
- stride: 32
  type: PadStride
label_list:
- battery
- board
- fire
