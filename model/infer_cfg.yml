# =====================================================
# 模型推理配置文件示例（以 PP-YOLOE 为例）
# 请替换为你自己模型对应的配置内容
# =====================================================

mode: paddle
draw_threshold: 0.5
metric: COCO
use_dynamic_shape: false
arch: PPYOLOE
min_subgraph_size: 3

Preprocess:
  - type: Resize
    target_size: [640, 640]
    keep_ratio: false
    interp: 2
  - type: NormalizeImage
    mean: [0.485, 0.456, 0.406]
    std:  [0.229, 0.224, 0.225]
    is_scale: true
  - type: Permute

label_list:
  - battery
  - board
  - fire

NMS:
  keep_top_k: 100
  name: MultiClassNMS
  nms_threshold: 0.5
  nms_top_k: 1000
  score_threshold: 0.3
