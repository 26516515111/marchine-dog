mode: paddle
draw_threshold: 0.5
metric: COCO
use_dynamic_shape: true
arch: YOLO
min_subgraph_size: 3
Preprocess:
- interp: 2
  keep_ratio: true
  target_size:
  - 768
  - 768
  type: Resize
- is_scale: true
  mean:
  - 0.485
  - 0.456
  - 0.406
  std:
  - 0.229
  - 0.224
  - 0.225
  type: NormalizeImage
- type: Permute
- stride: 32
  type: PadStride
label_list:
- battery
- board
- fire
