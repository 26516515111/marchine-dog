# PP-YOLOE+-s 全量训练配置（Train + Val 合并，无验证集保留）
# 基于 ppyoloe_plus_fire_c1_light.yml，仅修改数据集路径：
#   - TrainDataset: instance_train.json -> instance_train_full.json（train/ 目录）
#   - EvalDataset:  val/ + instance_val.json -> train/ + instance_train_full.json（自身监控）
#   - TestDataset:  同上
# 其余所有参数（学习率、epoch、增强策略、Head/NMS、模型结构）均与 c1_light 完全一致

# ==================== 继承基础配置 ====================
_BASE_: [
  '../datasets/coco_detection.yml',
  '../runtime.yml',
  '../ppyoloe/_base_/optimizer_300e.yml',    # 复用300e优化器基础
  '../ppyoloe/_base_/ppyoloe_plus_crn.yml',  # PP-YOLOE+ 模型结构（含EMA）
  '../ppyoloe/_base_/ppyoloe_plus_reader.yml', # PP-YOLOE+ 数据读取器
]

# ==================== 模型配置 ====================
# Objects365 预训练权重（核心优势）
# Objects365: 365个类别, 1.7M张图片，特征迁移能力远超COCO
pretrain_weights: https://bj.bcebos.com/v1/paddledet/models/pretrained/ppyoloe_crn_s_obj365_pretrained.pdparams

# 类别数量：battery=1, board=2, fire=3
num_classes: 3

# PP-YOLOE-s 缩放因子（与 A1 相同，确保加载预训练权重）
depth_mult: 0.33
width_mult: 0.50

# Eval/Test use keep_ratio=True + PadBatch, so input shapes are dynamic.
# Disable the fixed eval_size inherited from ppyoloe_plus_reader.yml.
eval_size: ~

# ==================== 训练轮数 ====================
# 【修改处】轮数定为 150（降低过拟合风险）
epoch: 150

log_iter: 20
snapshot_epoch: 5
save_dir: output/ppyoloe_plus_fire_full
weights: output/ppyoloe_plus_fire_full/best_model

# ==================== 学习率配置 ====================
# PP-YOLOE+ 官方用 base_lr=0.001（比 A1 的 0.0005 高一倍）
# Objects365 预训练 + 更好的 stem/alpha 设计使训练更稳定，可以用更高 lr
LearningRate:
  base_lr: 0.001
  schedulers:
    - !CosineDecay
      max_epochs: 150  # 同步修改
    - !LinearWarmup
      start_factor: 0.0
      epochs: 10        # 更长 warmup 配合较高 lr

# ==================== 优化器配置 ====================
OptimizerBuilder:
  optimizer:
    type: Momentum
    momentum: 0.9
  regularizer:
    type: L2
    factor: 0.0005

# ==================== 数据集配置 ====================
# 【唯一修改处】使用合并后的全量数据集（train + val = 447张，1142个标注）
TrainDataset:
  !COCODataSet
  image_dir: train
  anno_path: annotations/instance_train_full_no_hn.json
  dataset_dir: ../A_train/coco_dataset
  data_fields: ['image', 'gt_bbox', 'gt_class', 'is_crowd']
  allow_empty: true

# 无真实验证集，用训练集自身评估（仅供监控收敛状态，不代表真实泛化性能）
EvalDataset:
  !COCODataSet
  image_dir: train
  anno_path: annotations/instance_train_full_no_hn.json
  dataset_dir: ../A_train/coco_dataset

TestDataset:
  !ImageFolder
  anno_path: ../A_train/coco_dataset/annotations/instance_train_full_no_hn.json

metric: COCO

# ==================== 数据读取器配置 ====================
# PP-YOLOE+ 官方 reader 不含 Mosaic/Mixup，在此手动加入
# 注意：NormalizeImage 必须用 norm_type=none（PP-YOLOE+ 要求）
worker_num: 8

TrainReader:
  sample_transforms:
    - Decode: {}
    - Mosaic: {prob: 0.5, enable_mixup: true, mixup_prob: 0.3}
    - RandomDistort: {
        brightness: [0.5, 1.5, 0.5],
        contrast:   [0.5, 1.5, 0.5],
        saturation: [0.5, 1.5, 0.5],
        hue:        [-18, 18, 0.5]
      }
    - RandomExpand: {fill_value: [123.675, 116.28, 103.53]}
    - RandomCrop: {}
    - RandomFlip: {}
  batch_transforms:
    - BatchRandomResize: {
        target_size: [640, 704, 768],
        random_size: True,
        random_interp: True,
        keep_ratio: True
      }
    # PP-YOLOE+ 使用 norm_type=none（不做 ImageNet 归一化，与 A1 不同！）
    - NormalizeImage: {mean: [0., 0., 0.], std: [1., 1., 1.], norm_type: none}
    - Permute: {}
    - PadBatch: {pad_to_stride: 32}
    - PadGT: {}
  batch_size: 4
  shuffle: true
  drop_last: true
  use_shared_memory: true
  close_mosaic: 30    # 【修改处】最后 30 轮关闭 Mosaic 做精调

EvalReader:
  sample_transforms:
    - Decode: {}
    - Resize: {target_size: [768, 768], keep_ratio: True, interp: 2}
    # 验证/测试也必须用 norm_type=none
    - NormalizeImage: {mean: [0., 0., 0.], std: [1., 1., 1.], norm_type: none}
    - Permute: {}
  batch_transforms:
    - PadBatch: {pad_to_stride: 32}
  batch_size: 1

TestReader:
  inputs_def:
    image_shape: [3, -1, -1]
  sample_transforms:
    - Decode: {}
    - Resize: {target_size: [768, 768], keep_ratio: True, interp: 2}
    - NormalizeImage: {mean: [0., 0., 0.], std: [1., 1., 1.], norm_type: none}
    - Permute: {}
  batch_transforms:
    - PadBatch: {pad_to_stride: 32}
  batch_size: 1

# ==================== Head / NMS 配置 ====================
# 覆盖 ppyoloe_plus_crn.yml 中的默认值
PPYOLOEHead:
  fpn_strides: [32, 16, 8]
  grid_cell_scale: 5.0
  grid_cell_offset: 0.5
  static_assigner_epoch: 50  # 【修改处】预热期按比例下调为前50轮
  use_varifocal_loss: True
  loss_weight: {class: 1.0, iou: 2.5, dfl: 0.5}
  static_assigner:
    name: ATSSAssigner
    topk: 9
  assigner:
    name: TaskAlignedAssigner
    topk: 13
    alpha: 1.0
    beta: 6.0
  nms:
    name: MultiClassNMS
    nms_top_k: 1000
    keep_top_k: 300
    score_threshold: 0.05
    nms_threshold: 0.55
