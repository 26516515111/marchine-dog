# 火焰检测训练配置文件
# 使用 PP-YOLOE-s 模型

# ==================== 数据配置 ====================
data:
  train_ann: "mycode/data/annotations_train.json"
  val_ann: "mycode/data/annotations_val.json"
  train_images: "D:/work/Marchine Dog/A_train/Image"
  val_images: "D:/work/Marchine Dog/A_train/Image"
  num_classes: 3
  class_names: ["battery", "board", "fire"]

# ==================== 模型配置 ====================
model:
  arch: "ppyoloe_s"  # PP-YOLOE-s 轻量级模型
  pretrained: "https://paddledet.bj.bcebos.com/models/ppyoloe_crn_s_300e_coco.pdparams"
  input_size: [640, 640]

# ==================== 训练配置 ====================
train:
  epochs: 100
  batch_size: 8
  learning_rate: 0.001
  lr_scheduler: "cosine"
  warmup_epochs: 5
  weight_decay: 0.0005
  num_workers: 4
  
# ==================== 优化器配置 ====================
optimizer:
  type: "adam"
  momentum: 0.9
  
# ==================== 数据增强 ====================
augmentation:
  random_resize: [320, 640]
  random_flip: true
  random_crop: true
  normalize:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

# ==================== 输出配置 ====================
output:
  save_dir: "mycode/output"
  save_interval: 10
  log_interval: 10

# ==================== 评估配置 ====================
eval:
  conf_threshold: 0.3
  nms_threshold: 0.5
  eval_interval: 5
