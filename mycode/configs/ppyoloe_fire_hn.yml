# PP-YOLOE-s 火焰检测配置文件（含 Hard Negative 样本）
# 用于 PaddleDetection 官方训练脚本

# 继承基础配置
_BASE_: [
  '../datasets/coco_detection.yml',  # COCO 数据集配置
  '../runtime.yml',                  # 运行时配置
  '../ppyoloe/_base_/optimizer_300e.yml',  # 优化器基础配置
  '../ppyoloe/_base_/ppyoloe_crn.yml',     # PP-YOLOE 模型结构配置
  '../ppyoloe/_base_/ppyoloe_reader.yml',  # 数据读取器配置
]

# ==================== 模型配置 ====================
# 预训练权重：使用 COCO 数据集预训练的 PP-YOLOE-s 模型
pretrain_weights: ../ppyolo/ppyoloe_crn_s_300e_coco.pdparams

# 类别数量：检测 3 个类别（电池、电路板、火焰）
num_classes: 3

# 模型缩放因子：必须与 pretrain_weights 匹配
# PP-YOLOE-s 使用 width_mult=0.50, depth_mult=0.33
depth_mult: 0.33
width_mult: 0.50

# NOTE: PPYOLOEHead loss_weight 仅支持 {class, iou, dfl} 键
# VarifocalLoss 不支持 per-class 权重
# 类别不平衡通过数据级过采样解决

# ==================== 训练配置 ====================
# 训练轮数：增加到 200 个 epoch 以更好地学习 minority 类别
epoch: 200

# 日志间隔：每 20 个 batch 打印一次训练日志
log_iter: 20

# 快照间隔：每 10 个 epoch 保存一次模型权重
snapshot_epoch: 10

# 模型保存路径：保存最佳模型的路径
weights: output/ppyoloe_fire_hn/best_model

# ==================== 学习率配置 ====================
LearningRate:
  # 基础学习率：提高以加速收敛
  base_lr: 0.0005
  
  schedulers:
    # 余弦退火调度器：学习率按余弦函数衰减
    - !CosineDecay
      max_epochs: 200  # 最大训练轮数
    
    # 线性预热调度器：前 5 个 epoch 线性增加学习率
    - !LinearWarmup
      start_factor: 0.0  # 初始学习率因子（0.0 表示从 0 开始）
      epochs: 5          # 预热轮数

# ==================== 优化器配置 ====================
OptimizerBuilder:
  optimizer:
    # 优化器类型：Momentum（带动量的随机梯度下降）
    type: Momentum
    # 动量因子：加速收敛，减少震荡
    momentum: 0.9
  
  regularizer:
    # 正则化类型：L2 正则化（权重衰减）
    type: L2
    # 正则化系数：防止过拟合
    factor: 0.0005

# ==================== 数据集配置 ====================
# 训练集配置（含 Hard Negative 样本）
TrainDataset:
  !COCODataSet
  image_dir: D:/work/Marchine Dog/dog/A_train/Image  # 训练图片目录（原始 + hard negative 都在此）
  anno_path: D:/work/Marchine Dog/dog/A_train/coco/annotations/instance_train_with_hn.json  # 含 hard negative 的标注
  dataset_dir: .
  data_fields: ['image', 'gt_bbox', 'gt_class', 'is_crowd']  # 数据字段
  allow_empty: true  # 允许空标注

# 验证集配置
EvalDataset:
  !COCODataSet
  image_dir: D:/work/Marchine Dog/dog/A_train/coco/val  # 验证图片目录
  anno_path: D:/work/Marchine Dog/dog/A_train/coco/annotations/instance_val.json  # 验证标注文件
  dataset_dir: .

# 测试集配置
TestDataset:
  !ImageFolder
  anno_path: D:/work/Marchine Dog/dog/A_train/coco/annotations/instance_val.json  # 测试标注文件

# 评估指标：使用 COCO 格式的 mAP 评估
metric: COCO

# ==================== 数据读取器配置 ====================
# 工作进程数：数据加载的并行进程数
worker_num: 4

# 训练数据读取器
TrainReader:
  sample_transforms:  # 单样本数据增强
    - Decode: {}                    # 解码图片
    - Mosaic: {prob: 0.3, enable_mixup: true, mixup_prob: 0.2}  # Mosaic + Mixup 增强
    - RandomDistort: {              # 随机颜色抖动（含 BrightnessContrast + HSV）
        brightness: [0.5, 1.5, 0.5],
        contrast: [0.5, 1.5, 0.5],
        saturation: [0.5, 1.5, 0.5],
        hue: [-18, 18, 0.5]
      }
    - MotionBlur: {k: [3, 7], angle: [-45, 45], prob: 0.3}  # 运动模糊：模拟相机/目标运动
    - GaussianNoise: {mean: 0, std: [5, 15], prob: 0.2}     # 高斯噪声：模拟传感器噪声
    - RandomExpand: {fill_value: [123.675, 116.28, 103.53]}  # 随机扩展
    - RandomCrop: {}                # 随机裁剪
    - RandomFlip: {}                # 随机水平翻转
  
  batch_transforms:  # 批量数据增强
    - BatchRandomResize: {
        target_size: [640, 768, 896],  # 根据标注大小设定（平均目标 133-164 像素）
        random_size: True,      # 随机选择尺寸
        random_interp: True,    # 随机插值方法
        keep_ratio: False       # 不保持宽高比
      }
    - NormalizeImage: {
        mean: [0.485, 0.456, 0.406],  # ImageNet 均值
        std: [0.229, 0.224, 0.225],   # ImageNet 标准差
        is_scale: True                 # 像素值归一化到 [0, 1]
      }
    - Permute: {}       # 通道顺序转换 (HWC -> CHW)
    - PadGT: {}         # 填充 Ground Truth
  
  batch_size: 4        # 批量大小：增加以提高训练稳定性
  shuffle: true        # 随机打乱数据
  drop_last: true      # 丢弃最后一个不完整的 batch
  use_shared_memory: true  # 使用共享内存加速
  close_mosaic: 20     # 最后 20 个 epoch 关闭 Mosaic/Mixup，提升收敛

# 验证数据读取器
EvalReader:
  sample_transforms:
    - Decode: {}                    # 解码图片
    - Resize: {target_size: [640, 640], keep_ratio: False, interp: 2}  # 缩放到固定 640x640
    - NormalizeImage: {mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225], is_scale: True}
    - Permute: {}
  batch_size: 1  # 验证时 batch_size 为 1

# 测试数据读取器
TestReader:
  sample_transforms:
    - Decode: {}
    - Resize: {target_size: [640, 640], keep_ratio: False, interp: 2}  # 缩放到固定 640x640
    - NormalizeImage: {mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225], is_scale: True}
    - Permute: {}
  batch_size: 1
