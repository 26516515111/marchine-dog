# PP-YOLOE+-s Fine-tune 配置（Hard Negative Mining）
# 基于 model_2（ppyoloe_plus_fire_c1）进行 fine-tune
# 核心变化：
#   1. 使用合并数据集（原训练集 324 + 硬样本 42 = 366 张）
#   2. 使用 model_2 权重热启动，而非 Objects365 预训练
#   3. 学习率大幅降低（0.0001），防止过拟合或遗忘已学特征
#   4. 训练轮数减少（50 epoch），只做精调
#   5. 关闭 Mosaic（直接用 RandomFlip + Distort 轻增强）
#   6. 最后 10 轮 close_mosaic 已为 0，保持稳定

_BASE_: [
  '../datasets/coco_detection.yml',
  '../runtime.yml',
  '../ppyoloe/_base_/optimizer_300e.yml',
  '../ppyoloe/_base_/ppyoloe_plus_crn.yml',
  '../ppyoloe/_base_/ppyoloe_plus_reader.yml',
]

# ── 热启动权重（使用 model_2 已训练的参数）─────────────────────────────────
pretrain_weights: output/ppyoloe_plus_fire_c1/best_model

num_classes: 3
depth_mult: 0.33
width_mult: 0.50
eval_size: ~

# ── 训练轮数：50 epoch fine-tune ──────────────────────────────────────────
epoch: 50
log_iter: 10
snapshot_epoch: 5
save_dir: output/ppyoloe_plus_fire_hn
weights: output/ppyoloe_plus_fire_hn/best_model

# ── 学习率：大幅降低（约为原始的 1/10）───────────────────────────────────
LearningRate:
  base_lr: 0.0001
  schedulers:
    - !CosineDecay
      max_epochs: 50
    - !LinearWarmup
      start_factor: 0.1
      epochs: 3

OptimizerBuilder:
  optimizer:
    type: Momentum
    momentum: 0.9
  regularizer:
    type: L2
    factor: 0.0005

# ── 数据集：使用合并后的 fine-tune 数据集 ────────────────────────────────
TrainDataset:
  !COCODataSet
  image_dir: train
  anno_path: annotations/instance_train_finetune.json
  dataset_dir: ../A_train/coco_dataset
  data_fields: ['image', 'gt_bbox', 'gt_class', 'is_crowd']
  allow_empty: true

EvalDataset:
  !COCODataSet
  image_dir: val
  anno_path: annotations/instance_val.json
  dataset_dir: ../A_train/coco_dataset

TestDataset:
  !ImageFolder
  anno_path: ../A_train/coco_dataset/annotations/instance_val.json

metric: COCO

# ── 数据读取器：轻增强（不用 Mosaic，避免破坏已有的优质权重）──────────────
worker_num: 4

TrainReader:
  sample_transforms:
    - Decode: {}
    - RandomDistort: {
        brightness: [0.6, 1.4, 0.5],
        contrast:   [0.6, 1.4, 0.5],
        saturation: [0.6, 1.4, 0.5],
        hue:        [-12, 12, 0.5]
      }
    - MotionBlur: {k: [3, 5], angle: [-30, 30], prob: 0.2}
    - RandomExpand: {fill_value: [123.675, 116.28, 103.53]}
    - RandomCrop: {}
    - RandomFlip: {}
  batch_transforms:
    - BatchRandomResize: {
        target_size: [640, 768],
        random_size: True,
        random_interp: True,
        keep_ratio: True
      }
    - NormalizeImage: {mean: [0., 0., 0.], std: [1., 1., 1.], norm_type: none}
    - Permute: {}
    - PadBatch: {pad_to_stride: 32}
    - PadGT: {}
  batch_size: 4
  shuffle: true
  drop_last: true
  use_shared_memory: true
  close_mosaic: 0   # fine-tune 阶段不使用 Mosaic

EvalReader:
  sample_transforms:
    - Decode: {}
    - Resize: {target_size: [768, 768], keep_ratio: True, interp: 2}
    - NormalizeImage: {mean: [0., 0., 0.], std: [1., 1., 1.], norm_type: none}
    - Permute: {}
  batch_transforms:
    - PadBatch: {pad_to_stride: 32}
  batch_size: 1

TestReader:
  inputs_def:
    image_shape: [3, -1, -1]
  sample_transforms:
    - Decode: {}
    - Resize: {target_size: [768, 768], keep_ratio: True, interp: 2}
    - NormalizeImage: {mean: [0., 0., 0.], std: [1., 1., 1.], norm_type: none}
    - Permute: {}
  batch_transforms:
    - PadBatch: {pad_to_stride: 32}
  batch_size: 1

# ── Head / NMS 配置（与 c1 保持一致）────────────────────────────────────
PPYOLOEHead:
  fpn_strides: [32, 16, 8]
  grid_cell_scale: 5.0
  grid_cell_offset: 0.5
  static_assigner_epoch: 30
  use_varifocal_loss: True
  loss_weight: {class: 1.0, iou: 2.5, dfl: 0.5}
  static_assigner:
    name: ATSSAssigner
    topk: 9
  assigner:
    name: TaskAlignedAssigner
    topk: 13
    alpha: 1.0
    beta: 6.0
  nms:
    name: MultiClassNMS
    nms_top_k: 1000
    keep_top_k: 300
    score_threshold: 0.05
    nms_threshold: 0.55
