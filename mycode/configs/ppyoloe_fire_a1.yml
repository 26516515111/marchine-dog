# PP-YOLOE-s 火焰检测配置文件 (A1 调参优化版)
# 基于 mycode/configs/ppyoloe_fire.yml，按 A1 方案调参
#
# A1 变更摘要:
#   epoch:            200  -> 350      (小数据集+强增强需要更多迭代)
#   base_lr:          0.0005 (不变)    (强增强+小 batch 限制了 lr 上限，实测 0.001 导致 epoch 4 崩溃)
#   warmup_epochs:    5     -> 5       (保持原值)
#   close_mosaic:     30    -> 55      (最后 55 轮不做 Mosaic 有利精调)
#   nms_threshold:    0.7   -> 0.55    (降低阈值减少漏检)
#   score_threshold:  0.03  -> 0.05    (减少低置信度 FP)
#   GridMask prob:    0.4   -> 0.5     (小数据集加强正则化)
#
# 预期 F1: 0.83 ~ 0.85

# 继承基础配置
_BASE_: [
  '../datasets/coco_detection.yml',  # COCO 数据集配置
  '../runtime.yml',                  # 运行时配置
  '../ppyoloe/_base_/optimizer_300e.yml',  # 优化器基础配置
  '../ppyoloe/_base_/ppyoloe_crn.yml',     # PP-YOLOE 模型结构配置
  '../ppyoloe/_base_/ppyoloe_reader.yml',  # 数据读取器配置
]

# ==================== 模型配置 ====================
# 预训练权重：使用 COCO 数据集预训练的 PP-YOLOE-s 模型
pretrain_weights: https://paddledet.bj.bcebos.com/models/ppyoloe_crn_s_300e_coco.pdparams

# 类别数量：检测 3 个类别（电池、电路板、火焰）
num_classes: 3

# 模型缩放因子：必须与 pretrain_weights 匹配
# PP-YOLOE-s 使用 width_mult=0.50, depth_mult=0.33
depth_mult: 0.33
width_mult: 0.50

# NOTE: PPYOLOEHead loss_weight 仅支持 {class, iou, dfl} 键
# VarifocalLoss 不支持 per-class 权重，class_weight 列表会被静默忽略
# 类别不平衡通过数据级过采样解决（见 oversample_minority.py）

# ==================== 训练配置 ====================
# A1: 200 -> 350 epoch（小数据集+强增强需要更多迭代）
epoch: 350

# 日志间隔：每 20 个 batch 打印一次训练日志
log_iter: 20

# 快照间隔：每 5 个 epoch 保存 + 评估一次（350 epoch 共 70 次评估点）
snapshot_epoch: 5

# 模型保存路径：保存最佳模型的路径
weights: output/ppyoloe_fire_a1/best_model

# ==================== 学习率配置 ====================
LearningRate:
  # 保持原版 lr=0.0005（强增强+小 batch_size 限制 lr 上限）
  # 实测：0.01 和 0.001 均在 epoch 4 导致分类头梯度爆炸
  # 通过 350 epoch 补偿收敛速度，而非通过提高 lr
  base_lr: 0.0005
  
  schedulers:
    - !CosineDecay
      max_epochs: 350
    
    - !LinearWarmup
      start_factor: 0.0
      epochs: 5

# ==================== 优化器配置 ====================
OptimizerBuilder:
  optimizer:
    type: Momentum
    momentum: 0.9
  
  regularizer:
    type: L2
    factor: 0.0005

# ==================== 数据集配置 ====================
# 训练集配置
TrainDataset:
  !COCODataSet
  image_dir: D:/work/Marchine Dog/dog/A_train/coco/train  # 训练图片目录（324张）
  anno_path: D:/work/Marchine Dog/dog/A_train/coco/annotations/instance_train.json  # 原始标注
  dataset_dir: .
  data_fields: ['image', 'gt_bbox', 'gt_class', 'is_crowd']
  allow_empty: true

# 验证集配置
EvalDataset:
  !COCODataSet
  image_dir: D:/work/Marchine Dog/dog/A_train/coco/val
  anno_path: D:/work/Marchine Dog/dog/A_train/coco/annotations/instance_val.json
  dataset_dir: .

# 测试集配置
TestDataset:
  !ImageFolder
  anno_path: D:/work/Marchine Dog/dog/A_train/coco/annotations/instance_val.json

# 评估指标
metric: COCO

# ==================== 数据读取器配置 ====================
worker_num: 4

TrainReader:
  sample_transforms:  # 单样本数据增强
    - Decode: {}
    - Mosaic: {prob: 0.5, enable_mixup: true, mixup_prob: 0.3}
    - GridMask: {use_h: true, use_w: true, rotate: 1, ratio: 0.6, prob: 0.5}  # A1: prob 0.4 -> 0.5
    - RandomDistort: {
        brightness: [0.5, 1.5, 0.5],
        contrast: [0.5, 1.5, 0.5],
        saturation: [0.5, 1.5, 0.5],
        hue: [-18, 18, 0.5]
      }
    - MotionBlur: {k: [3, 7], angle: [-45, 45], prob: 0.3}
    - GaussianNoise: {mean: 0, std: [5, 15], prob: 0.2}
    - RandomExpand: {fill_value: [123.675, 116.28, 103.53]}
    - RandomCrop: {}
    - RandomFlip: {}
  
  batch_transforms:  # 批量数据增强
    - BatchRandomResize: {
        target_size: [640, 768, 896],
        random_size: True,
        random_interp: True,
        keep_ratio: False
      }
    - NormalizeImage: {
        mean: [0.485, 0.456, 0.406],
        std: [0.229, 0.224, 0.225],
        is_scale: True
      }
    - Permute: {}
    - PadGT: {}
  
  batch_size: 4
  shuffle: true
  drop_last: true
  use_shared_memory: true
  close_mosaic: 55  # A1: 30 -> 55（更长时间干净训练）

# 验证数据读取器
EvalReader:
  sample_transforms:
    - Decode: {}
    - Resize: {target_size: [640, 640], keep_ratio: False, interp: 2}
    - NormalizeImage: {mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225], is_scale: True}
    - Permute: {}
  batch_size: 1

# 测试数据读取器
TestReader:
  sample_transforms:
    - Decode: {}
    - Resize: {target_size: [640, 640], keep_ratio: False, interp: 2}
    - NormalizeImage: {mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225], is_scale: True}
    - Permute: {}
  batch_size: 1

# ==================== Head / NMS 配置 ====================
# A1: NMS 阈值 0.7 -> 0.55, score_threshold 0.03 -> 0.05
PPYOLOEHead:
  fpn_strides: [32, 16, 8]
  grid_cell_scale: 5.0
  grid_cell_offset: 0.5
  static_assigner_epoch: 100
  use_varifocal_loss: True
  loss_weight: {class: 1.0, iou: 2.5, dfl: 0.5}
  static_assigner:
    name: ATSSAssigner
    topk: 9
  assigner:
    name: TaskAlignedAssigner
    topk: 13
    alpha: 1.0
    beta: 6.0
  nms:
    name: MultiClassNMS
    nms_top_k: 1000
    keep_top_k: 300
    score_threshold: 0.05   # A1: 0.03 -> 0.05（减少低置信度 FP）
    nms_threshold: 0.55     # A1: 0.7 -> 0.55（降低阈值减少漏检）
